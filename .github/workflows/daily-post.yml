name: Daily Pallowyn Bot

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (for muxing music onto the generated video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate today's scenes (still -> video -> mux music)
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          MUSIC_TRACK_URL: ${{ secrets.MUSIC_TRACK_URL }}
        run: python scripts/main.py generate

      - name: Commit + push videos (so Buffer can fetch them by URL)
        run: |
          git config user.name "pallowyn-bot"
          git config user.email "pallowyn-bot@users.noreply.github.com"
          git add output/pallowyn
          git diff --cached --quiet || git commit -m "Pallowyn pipeline: videos for $(date -u +%Y-%m-%d)"
          git push

      - name: Schedule posts on Buffer
        env:
          BUFFER_API: ${{ secrets.BUFFER_API }}
        run: python scripts/main.py schedule

      - name: Commit state
        run: |
          git config user.name "pallowyn-bot"
          git config user.email "pallowyn-bot@users.noreply.github.com"
          git add state/pallowyn_state.json output/pallowyn
          git diff --cached --quiet || git commit -m "Pallowyn pipeline: state update $(date -u +%Y-%m-%d)"
          git push
